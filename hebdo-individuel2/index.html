<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning individuel — SAJ Anagallis</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <div id="app">
    <div class="toolbar screen-only" aria-label="Outils du planning">
      <div class="tool-group">
        <label for="userSelect">Personne</label>
        <select id="userSelect" disabled>
          <option>Chargement…</option>
        </select>
      </div>

      <div class="tool-group">
        <label for="yearSelect">Année</label>
        <select id="yearSelect" disabled>
          <option>Chargement…</option>
        </select>
      </div>

      <button id="printButton" type="button" class="print-button" disabled>
        <span aria-hidden="true">⎙</span>
        Imprimer
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>

    <main id="printViewport" class="planning-sheet" aria-live="polite">
      <div id="printInner">
        <header class="planning-header">
          <div class="heading-block">
            <div class="service-name">SAJ Anagallis</div>
            <h1 id="planningTitle">Planning</h1>
          </div>

          <div class="identity-block">
            <div id="portraitWrap" class="portrait-wrap" aria-hidden="true">
              <div id="portraitFallback" class="portrait-fallback">?</div>
              <img id="portrait" alt="" hidden>
            </div>
            <div>
              <div class="identity-label">Planning individuel</div>
              <div id="userFullName" class="user-full-name">Sélectionnez une personne</div>
            </div>
          </div>
        </header>

        <section id="weekGrid" class="week-grid">
          <!-- Généré par script.js -->
        </section>

        <div id="emptyState" class="empty-state" hidden>
          Aucune participation trouvée pour cette personne et cette année.
        </div>
      </div>
    </main>

    <div id="fatalError" class="fatal-error screen-only" hidden></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
