<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Planning collectif - SAJ Anagallis</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>

<body>

  <main id="app">

    <!-- ======================================================
         BOUTON IMPRESSION
         ====================================================== -->

    <div class="print-controls no-print">

      <button
        id="printButton"
        type="button"
      >
        Imprimer / PDF
      </button>

    </div>


    <!-- ======================================================
         CHARGEMENT
         ====================================================== -->

    <div id="status">
      Chargement du planning collectif…
    </div>


    <!-- ======================================================
         PLANNING
         ====================================================== -->

    <section
      id="sheet"
      class="sheet hidden"
    >

      <!-- ====================================================
           TITRE
           ==================================================== -->

      <header class="planning-header">

        <div>

          <div class="planning-kicker">
            SAJ Anagallis
          </div>

          <h1>
            Planning collectif
          </h1>

        </div>

      </header>


      <!-- ====================================================
           PLANNING GÉNÉRÉ PAR JAVASCRIPT
           ==================================================== -->

      <div id="planning"></div>


      <!-- ====================================================
           PIED DE PAGE
           ==================================================== -->

      <footer class="planning-footer">

        Odynéo · Les Tourrais de Craponne ·
        Service d'accueil de jour Anagallis

      </footer>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
