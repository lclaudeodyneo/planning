<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Planning collectif SAJ Anagallis</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>

<body>

  <main id="app">

    <!-- =====================================================
         SEUL BOUTON CONSERVÉ
         ===================================================== -->

    <div class="print-zone no-print">

      <button
        id="printButton"
        type="button"
      >
        Imprimer / PDF
      </button>

    </div>


    <!-- =====================================================
         MESSAGE DE CHARGEMENT
         ===================================================== -->

    <section id="status">

      Chargement du planning collectif…

    </section>


    <!-- =====================================================
         PLANNING
         ===================================================== -->

    <section
      id="sheet"
      class="hidden"
    >

      <header class="collective-main-title">

        <h1>
          Planning collectif
        </h1>

        <div>
          SAJ Anagallis
        </div>

      </header>


      <div
        id="week"
        class="collective-week"
      ></div>

    </section>

  </main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script src="script.js"></script>

</body>

</html>
